name: Check Steam Workshop IDs

on:
  push:
    paths:
      - 'cs2/**/MapChooser/maps.txt'  # 当任何 maps.txt 文件发生变化时触发
  workflow_dispatch:  # 允许手动触发
  schedule:
    - cron: '0 */6 * * *'  # 每 6 个小时触发一次

permissions:
  contents: write
  pull-requests: write

jobs:
  check-workshop-ids:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        maps_path:
          - 'cs2/kz/counterstrikesharp/configs/plugins/MapChooser/maps.txt'
          - 'cs2/mg/counterstrikesharp/configs/plugins/MapChooser/maps.txt'
          # 在这里添加更多的 maps.txt 文件路径

    steps:
    - name: 检出代码库
      uses: actions/checkout@v4
      with:
        ref: master  # 确保检出的是主分支
        fetch-depth: 0  # 获取完整提交历史

    - name: 计算分支名称
      id: branch_name
      env:
        MAPS_PATH: ${{ matrix.maps_path }}
      run: |
        branch_name="disable-unavailable-ids-$(printf '%s' "$MAPS_PATH" | md5sum | cut -d ' ' -f 1)"
        echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"

    - name: 删除现有的 disable-unavailable-ids 分支
      env:
        BRANCH_NAME: ${{ steps.branch_name.outputs.branch_name }}
      run: |
        git push origin --delete "$BRANCH_NAME" 2>/dev/null || true

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 运行检查脚本
      id: check_script
      run: |
        python scripts/check_workshop_ids.py ${{ matrix.maps_path }}
      continue-on-error: true

    - name: 输出结果
      run: |
        if [ "${{ steps.check_script.outputs.result }}" = "failure" ]; then
          echo -e "\033[91m部分 Steam Workshop IDs 不可用。\033[0m"
        elif [ "${{ steps.check_script.outputs.result }}" = "success" ]; then
          echo -e "\033[92m所有 Steam Workshop IDs 均可用。\033[0m"
        else
          echo "检查脚本执行失败，未生成有效结果。"
          exit 1
        fi

    - name: 创建拉取请求
      if: steps.check_script.outputs.result == 'failure'
      uses: peter-evans/create-pull-request@v8
      with:
        commit-message: 禁用不可用的 Steam Workshop IDs
        title: 禁用不可用的 Steam Workshop IDs
        body: |
          部分 Steam Workshop IDs 不可用。已将其对应的 enabled 字段从 1 改为 0。

          不可用 ID 列表:
          ${{ steps.check_script.outputs.unavailable_ids }}

          请审核并确认更改。
        branch: ${{ steps.branch_name.outputs.branch_name }}
        base: master
